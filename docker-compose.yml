services:
  # Runs the whole suite and exits with the Playwright exit code.
  tests:
    build: .
    image: wisebit-tests
    volumes:
      # report and traces land in the repo, so they survive the container
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

  # Serves the HTML report of the last run on http://localhost:9323
  report:
    build: .
    image: wisebit-tests
    profiles: [report]
    command: npx playwright show-report playwright-report --host 0.0.0.0 --port 9323
    ports:
      - "9323:9323"
    volumes:
      - ./playwright-report:/app/playwright-report
